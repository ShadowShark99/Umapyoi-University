[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "uma"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3.6.5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = {version = "1", features = ["derive"]}


[dependencies.napi]
version = "3.12.4"
features = ["napi4", "async"]

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
lto = true
strip = "symbols"
